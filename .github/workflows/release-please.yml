name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  plugin-zip:
    name: Build plugin zip
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      SLUG: kb-data-koppeling-voor-woocommerce
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Assemble plugin
        run: |
          mkdir -p "build/$SLUG"
          cp -R src composer.json composer.lock "$SLUG.php" readme.txt "build/$SLUG/"
          composer install --working-dir="build/$SLUG" --no-dev --optimize-autoloader --prefer-dist --no-progress
          rm "build/$SLUG/composer.lock"
      - name: Zip
        run: cd build && zip -rq "$SLUG-${{ needs.release-please.outputs.version }}.zip" "$SLUG"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "build/$SLUG-${{ needs.release-please.outputs.version }}.zip"
